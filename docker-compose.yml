services:
  db:
    image: postgres:16-alpine
    container_name: tsa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tsa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: truck-signs-api:local
    container_name: tsa_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8020:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tsa-network

volumes:
  postgres_data:

networks:
  tsa-network:
    driver: bridge